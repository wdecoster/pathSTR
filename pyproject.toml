[project]
name = "pathstr"
version = "0.1.0"
description = "Minimal Dash app for testing container deploys"
requires-python = ">=3.14"
dependencies = [
    "dash==2.18.2",
    "plotly==7.1.0",
    "gunicorn==26.2.0",
    "numpy>=2.3.0",
    "pandas==3.1.0",
    "cyvcf2==0.34.0",
    "dash-bio==1.0.2",
    "dash-bootstrap-components==1.5.0",
    "pyarrow>=15.0.0",
    "dash-daq==0.5.0",
    "rustworkx==0.18.1",
    # GEOparse, imported by dash-bio, does not declare this runtime dependency.
    "six>=1.16",
]
