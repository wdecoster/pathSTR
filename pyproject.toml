[project]
name = "pathstr"
version = "1.4.1"
description = "Dash app to explore pathogenic STR lengths and composition in 1000 Genomes long-read data"
requires-python = ">=3.14"
dependencies = [
    "dash==2.18.2",
    "plotly==7.1.0",
    "gunicorn==26.2.0",
    "numpy>=2.3.0",
    "pandas==3.1.0",
    "cyvcf2==0.34.0",
    "dash-bio==1.0.2",
    "dash-bootstrap-components==1.5.0",
    "pyarrow>=15.0.0",
    "dash-daq==0.5.0",
    "rustworkx==0.18.1",
    # GEOparse, imported by dash-bio, does not declare this runtime dependency.
    "six>=1.16",
]
