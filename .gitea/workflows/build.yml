# The pipeline itself lives in BioIT/container-image (.gitea/workflows/app.yml): this
# file only picks the triggers. It also runs .gitea/test.sh, which builds a small
# database from the test VCFs; the shared startup test is off since CI has no data.
name: Build and push image

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

jobs:
  image:
    uses: BioIT/container-image/.gitea/workflows/app.yml@main
    with:
      startup-test: false
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
