name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # install from uv.lock, the same dependency set the Containerfile ships
    - uses: astral-sh/setup-uv@v7
    - name: install
      run: uv sync --frozen --no-dev
    - name: unit tests
      run: uv run --frozen python -m unittest discover -s test -p 'test_*.py'
    - name: make_db
      run: uv run --frozen python app.py --vcf test/genotypes_test.fofn --save_db test_database --sample_info data/pathSTR_samples.tsv --store_only
    - name: run and shutdown
      run: |
        set -e
        uv run --frozen python app.py --db test_database &
        app_pid=$!
        sleep 120
        kill $app_pid
